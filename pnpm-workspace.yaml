packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  # toolchain
  "@e2e-dev/web": ^0.15.2
  "@shadcn/lint": ^0.2.1
  "@types/node": ^24.19.2
  e2e: ^0.21.2
  knip: ^6.42.0
  typescript: ^7.0.2
  ultracite: ^8.0.1
  undici: ^8.12.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

  # web
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-query": ^5.104.4
  "@tanstack/react-query-devtools": ^5.104.4
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  babel-plugin-react-compiler: ^1.0.0
  es-toolkit: ^1.52.0
  next: ^16.4.2
  next-themes: ^0.4.6
  react: 19.3.0
  react-dom: 19.3.0
  server-only: ^0.0.1
  tailwindcss: ^4.3.3

  # storage
  "@aws-sdk/client-s3": ^3.1153.0
  "@aws-sdk/s3-request-presigner": ^3.1153.0

  # writing
  "@mdxeditor/editor": ^4.3.3

  # sheet (read-only Univer embed)
  "@univerjs/preset-sheets-core": 1.1.0
  "@univerjs/presets": 1.1.0

  # ui
  "@base-ui/react": ^1.9.0
  "@fontsource-variable/geist": ^5.3.0
  class-variance-authority: ^0.7.1
  cn: ^0.5.0
  lucide-react: ^1.59.0
  shadcn: ^4.22.1
  sonner: ^2.0.8
  tw-animate-css: ^1.4.0

  # search
  "@orama/orama": 3.1.18
  "@orama/stopwords": 3.1.18

  # api
  "@orpc/client": ^1.15.7
  "@orpc/openapi": ^1.15.7
  "@orpc/server": ^1.15.7
  "@orpc/tanstack-query": ^1.15.7
  "@orpc/zod": ^1.15.7
  zod: ^4.6.7

  # mobile
  expo: 58.0.14
  expo-constants: ~58.0.12
  expo-linking: ~58.0.13
  expo-network: ~58.0.3
  expo-router: ~58.0.23
  expo-secure-store: ~58.0.2
  expo-status-bar: ~58.0.3
  expo-system-ui: ~58.0.6
  expo-web-browser: ~58.0.6
  lucide-react-native: ^1.59.0
  react-native: 0.88.0
  react-native-gesture-handler: ~3.3.0
  react-native-reanimated: 4.7.1
  react-native-safe-area-context: ~5.10.1
  react-native-screens: ~4.30.0
  react-native-svg: 15.16.0
  react-native-worklets: 0.13.0
  uniwind: ^1.12.2

  # server
  "@hono/node-server": ^2.1.5
  "@t3-oss/env-core": ^0.13.11
  hono: ^4.13.13

  # auth
  "@better-auth/drizzle-adapter": ^1.7.11
  "@better-auth/expo": ^1.7.11
  better-auth: ^1.7.11

  # db
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  postgres: ^3.4.9
  next-mdx-remote: 6.0.0
  rehype-autolink-headings: 7.1.0
  rehype-pretty-code: 0.14.5
  rehype-slug: 6.0.0
  remark-gfm: 4.0.1
  shiki: ^4.5.0
  "@tailwindcss/typography": ^0.5.20
  velite: ^0.4.0
  turbo: 2.11.9

overrides:
  vite@*: "catalog:"

allowBuilds:
  esbuild: false
  # Univer pulls protobufjs in transitively. Its postinstall only prints a notice, so it stays
  # unbuilt; listing it keeps pnpm 12 from treating the omission as an error.
  protobufjs: false
  sharp: false
  unrs-resolver: false

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
